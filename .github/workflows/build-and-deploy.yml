name: Build and Deploy to host:FTP, Node JS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16, 18, 20]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        run: |
          npm install # Install project dependencies
          curl -o .env https://gist.githubusercontent.com/goweki/e689193ed36165999f913a5fc37a090f/raw/d06b2c99ec00a9b2082af69e12fc3aa9a237680f/gistfile1.txt
          npm run build
          ls -a

  deploy:
    runs-on: ubuntu-latest
    needs: build # Ensure the "build" job completes before deploying

    steps:
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # local-dir: ./_next/ # This points to the build output directory of your Next.js app
          server-dir: /
          protocol: ftps
          port: 21
          timeout: 180000 # timeout value in milliseconds (here, 4 minutes)
